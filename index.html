        body { margin: 0; background-color: #050505; display: flex; justify-content: center; font-family: sans-serif; position: relative; color: #ffffff; }

    <script>
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            window.scrollTo(0, 0); 
            if (pageId === 'laos-page') { updateRandomImages('laos'); }
            else if (pageId === 'philippines-page') { updateRandomImages('phil'); }
        }
        function goHome() { if (window.innerWidth <= 768) { showPage('main-mobile'); } else { showPage('main-pc'); } }
        const totalPhotos = 20;
        function getPerfectRandomSequence() {
            let numbers = [];
            for (let i = 1; i <= totalPhotos; i++) { numbers.push(i < 10 ? '0' + i : '' + i); }
            for (let i = numbers.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [numbers[i], numbers[j]] = [numbers[j], numbers[i]];
            }
            return numbers;
        }
        function updateRandomImages(prefix) {
            const randomList = getPerfectRandomSequence();
            for (let i = 0; i < 4; i++) {
                const imgTag = document.getElementById(prefix + '-img-' + (i+1));
                if (imgTag) { imgTag.src = 'photo_' + randomList[i] + '.png'; }
            }
        }
        function resizeImageMaps() {
            const maps = document.querySelectorAll('map');
            maps.forEach(map => {
                const img = document.querySelector(`img[usemap="#${map.name}"]`);
                if (img && img.complete) {
                    const areas = map.querySelectorAll('area');
                    const wPercent = img.clientWidth / 1080; 
                    const hPercent = img.clientHeight / 1024; 
                    areas.forEach(area => {
                        if (!area.dataset.originalCoords) { area.dataset.originalCoords = area.coords; }
                        const coords = area.dataset.originalCoords.split(',');
                        const newCoords = coords.map((c, i) => i % 2 === 0 ? Math.round(c * wPercent) : Math.round(c * hPercent));
                        area.coords = newCoords.join(',');
                    });
                }
            });
        }
        document.addEventListener("DOMContentLoaded", function() {
            updateRandomImages('laos'); updateRandomImages('phil');
            setInterval(() => {
                const activePage = document.querySelector('.page.active');
                if (activePage && activePage.id === 'laos-page') { updateRandomImages('laos'); }
                else if (activePage && activePage.id === 'philippines-page') { updateRandomImages('phil'); }
            }, 5000);
            if (window.innerWidth <= 768) { showPage('main-mobile'); } else { showPage('main-pc'); }
            window.addEventListener('resize', resizeImageMaps);
            const mobileImg = document.querySelector('#main-mobile img');
            if (mobileImg) {
                mobileImg.addEventListener('load', resizeImageMaps);
                if (mobileImg.complete) resizeImageMaps();
            }
        });
    </script>
