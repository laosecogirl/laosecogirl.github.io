<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>햄버거 - 유흥·밤문화 · 에코걸 문의</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <!-- 🔍 [추가] 구글 검색창 설명문 (핵심 키워드를 조합하여 자연스러운 문장으로 구성) -->
    <meta name="description" content="남자를 위한 동남아 햄버거 공식 홈페이지. 라오스, 필리핀 황제 투어 및 인기 유흥, 24시 밀착 에코걸 서비스, 가라오케 예약 및 밤문화 상세 문의 안내.">
    
    <!-- 🔍 [추가] 구글 로봇 수집용 핵심 검색어 태그 -->
    <meta name="keywords" content="동남아 햄버거, 에코걸, 동남아 유흥, 동남아 밤문화, 라오스 에코걸, 필리핀 에코걸, 황제투어, 가라오케 문의, laosecogirl">

    <meta property="og:type" content="website">
    <meta property="og:title" content="동남아 햄버거">
    <meta property="og:description" content="남자를 위한 동남아 에코걸 · 유흥 · 밤문화 문의">
    <meta property="og:image" content="https://github.io"> <!-- 🔗 정확한 경로 지정 -->
    <meta property="og:url" content="https://laosecogirl.github.io/"> <!-- 🔗 깃허브 주소 반영 -->

    <style>
        body { margin: 0; background-color: #050505; display: flex; justify-content: center; font-family: sans-serif; position: relative; color: #ffffff; }
        .page { display: none; width: 100%; max-width: 1920px; padding-bottom: 120px; box-sizing: border-box; }
        .active { display: block; } 
        img { width: 100%; height: auto; display: block; }
        .photo-grid-container { max-width: 768px; margin: 15px auto; padding: 10px; background: rgba(0,0,0,0.6); border: 2px solid #ff007f; box-shadow: 0 0 15px rgba(255,0,127,0.4); border-radius: 12px; box-sizing: border-box; }
        .photo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .photo-grid img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 6px; transition: opacity 0.5s ease-in-out; }
        .ticker-wrap { width: 100%; overflow: hidden; padding: 15px 0; box-sizing: border-box; margin: 15px 0; border-top: 1px solid rgba(255,0,127,0.3); border-bottom: 1px solid rgba(255,0,127,0.3); }
        .ticker { display: flex; white-space: nowrap; animation: ticker-move 20s linear infinite; }
        .ticker-item { color: #ff3399; font-size: 18px; font-weight: bold; padding: 0 35px; text-shadow: 0 0 5px rgba(255,51,153,0.6); }
        @keyframes ticker-move { 0% { transform: translate3d(100vw, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }
        .btn-bar { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; z-index: 9999; width: 92%; max-width: 600px; justify-content: center; }
        .floating-btn { height: 50px; border-radius: 12px; display: flex; justify-content: center; align-items: center; background-color: rgba(5,5,5,0.85); border: 2px solid #ff007f; box-shadow: 0 0 10px rgba(255,0,127,0.6), inset 0 0 5px rgba(255,0,127,0.3); cursor: pointer; text-decoration: none; font-weight: bold; font-size: 15px; color: #ffffff; transition: transform 0.2s, box-shadow 0.2s; white-space: nowrap; box-sizing: border-box; text-align: center; }
        .laos-btn { flex: 2; } .home-btn { flex: 1; } .phil-btn { flex: 2; }
        .floating-btn:hover { transform: scale(1.05); box-shadow: 0 0 18px rgba(255,0,127,0.9); }
        @media (max-width: 768px) {
            .page { max-width: 768px; padding-bottom: 100px; }
            .ticker-item { font-size: 16px !important; padding: 0 20px !important; }
            .btn-bar { bottom: 15px; gap: 8px; width: 94%; }
            .floating-btn { height: 46px; font-size: 13px; border-radius: 10px; }
            @keyframes ticker-move { 0% { transform: translate3d(100%, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }
        }
    </style>
    <script>
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            window.scrollTo(0, 0); 
            if (pageId === 'laos-page') { updateRandomImages('laos'); }
            else if (pageId === 'philippines-page') { updateRandomImages('phil'); }
        }
        function goHome() { if (window.innerWidth <= 768) { showPage('main-mobile'); } else { showPage('main-pc'); } }
        const totalPhotos = 20;
        function getPerfectRandomSequence() {
            let numbers = [];
            for (let i = 1; i <= totalPhotos; i++) { numbers.push(i < 10 ? '0' + i : '' + i); }
            for (let i = numbers.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [numbers[i], numbers[j]] = [numbers[j], numbers[i]];
            }
            return numbers;
        }
        function updateRandomImages(prefix) {
            const randomList = getPerfectRandomSequence();
            for (let i = 0; i < 4; i++) {
                const imgTag = document.getElementById(prefix + '-img-' + (i+1));
                if (imgTag) {
                    imgTag.src = 'photo_' + randomList[i] + '.png';
                }
            }
        }

        function resizeImageMaps() {
            const maps = document.querySelectorAll('map');
            maps.forEach(map => {
                const img = document.querySelector(`img[usemap="#${map.name}"]`);
                if (img && img.complete) {
                    const areas = map.querySelectorAll('area');
                    const wPercent = img.clientWidth / 1080; 
                    const hPercent = img.clientHeight / 1024; 
                    
                    areas.forEach(area => {
                        if (!area.dataset.originalCoords) {
                            area.dataset.originalCoords = area.coords;
                        }
                        const coords = area.dataset.originalCoords.split(',');
                        const newCoords = coords.map((c, i) => i % 2 === 0 ? Math.round(c * wPercent) : Math.round(c * hPercent));
                        area.coords = newCoords.join(',');
                    });
                }
            });
        }

        document.addEventListener("DOMContentLoaded", function() {
            updateRandomImages('laos');
            updateRandomImages('phil');
            setInterval(() => {
                const activePage = document.querySelector('.page.active');
                if (activePage && activePage.id === 'laos-page') { updateRandomImages('laos'); }
                else if (activePage && activePage.id === 'philippines-page') { updateRandomImages('phil'); }
            }, 5000);

            if (window.innerWidth <= 768) {
                showPage('main-mobile');
            } else {
                showPage('main-pc');
            }

            window.addEventListener('resize', resizeImageMaps);
            const mobileImg = document.querySelector('#main-mobile img');
            if (mobileImg) {
                mobileImg.addEventListener('load', resizeImageMaps);
                if (mobileImg.complete) resizeImageMaps();
            }
        });
    </script>
</head>
<body>
    <div id="main-pc" class="page">
        <img src="pc_banner.png" usemap="#pc-map">
        <map name="pc-map">
            <area shape="rect" coords="0,0,960,1080" href="javascript:showPage('laos-page')">
            <area shape="rect" coords="961,0,1920,1080" href="javascript:showPage('philippines-page')">
        </map>
    </div>
    <div id="main-mobile" class="page">
        <img src="mobile_banner.png" id="mobile-banner-img" usemap="#mobile-map">
        <map name="mobile-map">
            <area shape="rect" coords="0,0,540,1024" href="javascript:showPage('laos-page')">
            <area shape="rect" coords="541,0,1080,1024" href="javascript:showPage('philippines-page')">
        </map>
    </div>
    <div id="laos-page" class="page">
        <div class="ticker-wrap"><div class="ticker"><div class="ticker-item">★ 라오스 인기 밤문화 ★</div><div class="ticker-item">가라오케 최다 보유</div><div class="ticker-item">에코걸 24시 밀착 케어</div><div class="ticker-item">★ 라오스 인기 밤문화 ★</div><div class="ticker-item">가라오케 최다 보유</div><div class="ticker-item">에코걸 24시 밀착 케어</div></div></div>
        <div class="photo-grid-container"><div class="photo-grid"><img id="laos-img-1" src=""><img id="laos-img-2" src=""><img id="laos-img-3" src=""><img id="laos-img-4" src=""></div></div>
    </div>
</body>
</html>
