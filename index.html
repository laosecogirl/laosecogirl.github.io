        .btn-bar { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; z-index: 9999; width: 92%; max-width: 600px; justify-content: center; }
        .floating-btn { height: 50px; border-radius: 12px; display: flex; justify-content: center; align-items: center; background-color: rgba(5,5,5,0.85); border: 2px solid #ff007f; box-shadow: 0 0 10px rgba(255,0,127,0.6), inset 0 0 5px rgba(255,0,127,0.3); cursor: pointer; text-decoration: none; font-weight: bold; font-size: 15px; color: #ffffff; transition: transform 0.2s, box-shadow 0.2s; white-space: nowrap; box-sizing: border-box; text-align: center; }
        .laos-btn { flex: 2; } .home-btn { flex: 1; } .phil-btn { flex: 2; }

        }

    <script>
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            window.scrollTo(0, 0); 
            if (pageId === 'laos-page') { updateRandomImages('laos'); }
            else if (pageId === 'philippines-page') { updateRandomImages('phil'); }
        }
        function goHome() { if (window.innerWidth <= 768) { showPage('main-mobile'); } else { showPage('main-pc'); } }
        const totalPhotos = 20;
        function getPerfectRandomSequence() {
            let numbers = [];
            for (let i = 1; i <= totalPhotos; i++) { numbers.push(i < 10 ? '0' + i : '' + i); }
            for (let i = numbers.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [numbers[i], numbers[j]] = [numbers[j], numbers[i]];
            }
            return numbers;
        }
        function updateRandomImages(prefix) {
            const randomList = getPerfectRandomSequence();
            for (let i = 0; i < 4; i++) {
                const imgTag = document.getElementById(prefix + '-img-' + (i+1));
                if (imgTag) {
                    imgTag.src = 'photo_' + randomList[i] + '.png';
                }
            }
        }
        document.addEventListener("DOMContentLoaded", function() {
            updateRandomImages('laos');
            updateRandomImages('phil');
            setInterval(() => {
                const activePage = document.querySelector('.page.active');
                if (activePage && activePage.id === 'laos-page') { updateRandomImages('laos'); }
                else if (activePage && activePage.id === 'philippines-page') { updateRandomImages('phil'); }
            }, 5000);
            if (window.innerWidth <= 768) { showPage('main-mobile'); } else { showPage('main-pc'); }
        });
    </script>
